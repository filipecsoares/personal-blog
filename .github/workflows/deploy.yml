name: Deploy Blog to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.145.0"
          extended: true

      - name: Build site
        run: hugo --minify

      # Requires ACTIONS_DEPLOY_KEY secret with write access to filipecsoares/filipecsoares.github.io
      - name: Deploy to filipecsoares.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: filipecsoares/filipecsoares.github.io
          publish_branch: main
          publish_dir: ./public
          commit_message: "chore: deploy ${{ github.sha }}"
