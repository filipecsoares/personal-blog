baseURL = 'https://filipecsoares.github.io/'
languageCode = 'en-us'
title = 'Filipe Soares'
theme = 'typo'
enableRobotsTXT = true

[taxonomies]
tag = 'tags'

[params]
# Home meta description
description = "A tech-oriented personal blog by Filipe Soares."

# Appearance settings
theme = 'dark'
colorPalette = 'base16-ocean'
hideHeader = false

# Intro on main page, content in markdown
homeIntroTitle = 'Hi!'
homeIntroContent = """
I'm Filipe Soares, a Software Architect from Brazil. \\
I write about Software Architecture, Microservices, Containers, Databases, and Web Security. \\
Read more [about me](/about) or browse my [posts](/posts).
"""

# Collection to display on home
homeCollectionTitle = 'Posts'
homeCollection = 'posts'

# Lists parameters
paginationSize = 20
listSummaries = true
listDateFormat = '02 Jan 2006'

# Article metadata
readTime = true
showTags = true

# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = true
home = "~"

showFooter = true
# footerContent = """Custom"""

# Social icons
[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/filipe-soares-897a2151/"

[[params.social]]
name = "github"
url = "https://github.com/filipecsoares"

# Main menu pages
[[params.menu]]
name = "home"
url = "/"

[[params.menu]]
name = "posts"
url = "/posts"

[[params.menu]]
name = "about"
url = "/about"
